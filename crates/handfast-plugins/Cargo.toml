[package]
name = "handfast-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
handfast-desktop = { path = "../handfast-desktop", version = "0.3.0" }
handfast-proto = { path = "../handfast-proto", version = "0.3.0" }
handfast-runtime = { path = "../handfast-runtime", version = "0.3.0" }
serde_json.workspace = true
# `runcommand` spawns processes and streams their output; `sftp` is async only
# through the runtime, so the plugin crate needs the same tokio features.
tokio = { workspace = true, features = ["process", "io-util", "sync"] }

[dev-dependencies]
tokio.workspace = true
