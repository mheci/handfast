[package]
name = "handfast-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "handfastd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
handfast-desktop = { path = "../handfast-desktop", version = "0.2.0" }
handfast-net = { path = "../handfast-net", version = "0.2.0" }
handfast-plugins = { path = "../handfast-plugins", version = "0.2.0" }
handfast-proto = { path = "../handfast-proto", version = "0.2.0" }
handfast-runtime = { path = "../handfast-runtime", version = "0.2.0" }
handfast-store = { path = "../handfast-store", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
async-trait.workspace = true
handfast-net = { path = "../handfast-net", version = "0.2.0", features = ["test-support"] }
handfast-testkit = { path = "../handfast-testkit", version = "0.2.0" }
redb.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[lints.rust]
unsafe_code = "deny"
