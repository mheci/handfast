[package]
name = "handfast-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "handfast"
path = "src/bin/handfast.rs"

[features]
# The window. Off by default, so a plain `cargo build` is the headless build.
gui = ["dep:eframe"]

[dependencies]
clap.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }
handfast-desktop = { path = "../handfast-desktop", version = "0.3.0" }
handfast-net = { path = "../handfast-net", version = "0.3.0" }
handfast-plugins = { path = "../handfast-plugins", version = "0.3.0" }
handfast-proto = { path = "../handfast-proto", version = "0.3.0" }
handfast-runtime = { path = "../handfast-runtime", version = "0.3.0" }
handfast-store = { path = "../handfast-store", version = "0.3.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
async-trait.workspace = true
handfast-net = { path = "../handfast-net", version = "0.3.0", features = ["test-support"] }
handfast-testkit = { path = "../handfast-testkit", version = "0.3.0" }
redb.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[lints.rust]
unsafe_code = "deny"
