[workspace]
resolver = "2"
members = [
    "crates/handfast-proto",
    "crates/handfast-net",
    "crates/handfast-runtime",
    "crates/handfast-plugins",
    "crates/handfast-desktop",
    "crates/handfast-store",
    "crates/handfast-testkit",
    "crates/handfast-daemon",
    "xtask",
]
exclude = ["fuzz", "vendor/russh-sftp", "vendor/russh-util"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/mheci/handfast"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "wrap_help"] }
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rand = "0.10"
redb = "4.5"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
x509-parser = "0.18.1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = true

# Temporary, narrowly scoped forks removing an unmaintained transitive crate.
# See vendor/README.md for provenance and removal criteria.
[patch.crates-io]
russh-sftp = { path = "vendor/russh-sftp" }
russh-util = { path = "vendor/russh-util" }
