[workspace]
resolver = "2"
members = [
    "crates/handfast-proto",
    "crates/handfast-net",
    "crates/handfast-runtime",
    "crates/handfast-plugins",
    "crates/handfast-desktop",
    "crates/handfast-store",
    "crates/handfast-testkit",
    "crates/handfast-daemon",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/mheci/handfast"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "wrap_help"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = true
