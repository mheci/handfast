[workspace]
resolver = "2"
members = [
    "crates/handfast-proto",
    "crates/handfast-net",
    "crates/handfast-runtime",
    "crates/handfast-plugins",
    "crates/handfast-desktop",
    "crates/handfast-store",
    "crates/handfast-testkit",
    "crates/handfast-daemon",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/mheci/handfast"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "wrap_help"] }
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
redb = "4.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
x509-parser = "0.18.1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = true
