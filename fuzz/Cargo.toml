[package]
# Fuzzing harness workspace — intentionally detached from the root workspace
# (root Cargo.toml `exclude`s this directory). Built with cargo-fuzz/nightly:
#
#   cargo +nightly fuzz build -O
#   cargo +nightly fuzz run packet_parse -- -max_total_time=30
name = "handfast-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "io-util"] }
bytes = "1"
serde_json = "1"

[dependencies.handfast-protocol]
path = "../crates/protocol"

[dependencies.handfast-ipc]
path = "../crates/ipc"

[[bin]]
name = "packet_parse"
path = "fuzz_targets/packet_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_json"
path = "fuzz_targets/identity_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_request"
path = "fuzz_targets/ipc_request.rs"
test = false
doc = false
bench = false
