version: 2
updates:
  # Rust workspace dependencies (all crates live under the workspace root).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by CI / Release / Monitor workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
