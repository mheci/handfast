name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign the Windows installer (requires signing secrets)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  debian:
    name: debian 12 (amd64)
    needs: version
    runs-on: ubuntu-latest
    container: rust:1.90-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GUI build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo run -p xtask -- build
      - name: Build Debian package
        run: cargo run -p xtask -- deb --glibc 2.36 --label debian12 --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-debian12-amd64
          path: dist/*.deb
          if-no-files-found: error

  ubuntu:
    name: ubuntu 24.04 (amd64)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo run -p xtask -- build
      - name: Build Ubuntu package
        run: cargo run -p xtask -- deb --glibc 2.39 --label ubuntu24.04 --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-ubuntu24.04-amd64
          path: dist/*.deb
          if-no-files-found: error

  arch:
    name: archlinux (x86_64)
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: pacman -S --noconfirm --needed base-devel rust libx11 libxkbcommon wayland mesa
      - name: Build and package
        shell: bash
        run: |
          useradd -m builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/handfast
          chown -R builder:builder /home/builder/handfast
          su builder -c 'cd /home/builder/handfast && cargo run -p xtask -- build'
          pkgver=$(printf '%s' "$VERSION" | tr '-' '_')
          template=/home/builder/handfast/packaging/arch/PKGBUILD
          grep -qx 'pkgver=__VERSION__' "$template" || { echo "the PKGBUILD must carry pkgver=__VERSION__" >&2; exit 1; }
          mkdir -p /home/builder/pkg
          cp /home/builder/handfast/target/release/handfast /home/builder/pkg/
          cp /home/builder/handfast/README.md /home/builder/handfast/LICENSE-MIT /home/builder/handfast/THIRD-PARTY-NOTICES.md /home/builder/pkg/
          cp /home/builder/handfast/packaging/linux/handfast.service /home/builder/pkg/
          sed "s/__VERSION__/${pkgver}/" "$template" > /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder/pkg
          su builder -c 'cd /home/builder/pkg && makepkg -f --noconfirm'
          mkdir -p dist
          cp /home/builder/pkg/handfast-bin-[0-9]*.pkg.tar.* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-archlinux-x86_64
          path: dist/*.pkg.tar.*
          if-no-files-found: error

  windows:
    name: windows 11 (x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # A tag push signs when a certificate is configured. Without one, the
      # release still publishes an unsigned MSI.
      - name: Decide signing
        id: signing
        shell: pwsh
        run: |
          $sign = $false
          if ("${{ github.event_name }}" -eq "push" -and $env:WINDOWS_CERT_PFX_BASE64) {
            $sign = $true
          }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.sign_windows }}" -eq "true") {
            $sign = $true
          }
          $signValue = if ($sign) { "true" } else { "false" }
          "sign=$signValue" >> $env:GITHUB_OUTPUT

      - name: Check signing certificate
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) { throw "Set the WINDOWS_CERT_PFX_BASE64 repository secret." }
          if (-not $env:WINDOWS_CERT_PASSWORD) { throw "Set the WINDOWS_CERT_PASSWORD repository secret." }
      - run: cargo run -p xtask -- build
      - name: Decode signing certificate
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "handfast-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Locate signing and WiX tools
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $wixBin = $null
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candle) { $wixBin = Split-Path $candle.Source }
          if (-not $wixBin) {
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              ForEach-Object { Join-Path $_.FullName "bin" }
          }
          if (-not $wixBin) { throw "WiX Toolset not found" }
          "WIX_BIN=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sign handfast.exe
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /f $env:PFX_PATH /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 target\release\handfast.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for handfast.exe" }
      - name: Build MSI
        shell: pwsh
        run: |
          cargo run -p xtask -- msi
          if ($LASTEXITCODE -ne 0) { throw "the MSI build failed" }
      - name: Sign MSI
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "dist\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          & $env:SIGNTOOL sign /fd SHA256 /f $env:PFX_PATH /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for the MSI" }
      - name: Verify signatures
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL verify /pa /all target\release\handfast.exe
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for handfast.exe" }
          Get-ChildItem "dist\*.msi" | ForEach-Object {
            & $env:SIGNTOOL verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($_.Name)" }
          }
      - name: Portable asset
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: cargo run -p xtask -- portable
      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item $env:PFX_PATH -Force }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-windows11-x64
          path: dist/*.msi
          if-no-files-found: error
      # The updater refuses an unsigned asset, so an unsigned release publishes
      # no Windows portable binary rather than one every client rejects.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.sign == 'true'
        with:
          name: handfast-portable-windows-x64
          path: dist/handfast-*.exe
          if-no-files-found: error

  linux-portable:
    name: linux portable (debian 12)
    needs: version
    runs-on: ubuntu-latest
    # The oldest glibc a user may run, so the portable asset matches the deb.
    container: rust:1.90-bookworm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GUI build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo run -p xtask -- build
      - run: cargo run -p xtask -- portable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-portable-linux-x64
          path: dist/handfast-x86_64-unknown-linux-gnu
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [version, debian, ubuntu, arch, windows, linux-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D dist
      - name: Add the third-party notices
        run: cp THIRD-PARTY-NOTICES.md dist/
      - run: cargo run -p xtask -- checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handfast-checksums
          path: |
            dist/SHA256SUMS
            dist/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, debian, ubuntu, arch, windows, linux-portable, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="docs/releases/${GITHUB_REF_NAME#v}.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
                --title "Handfast $GITHUB_REF_NAME" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
                --title "Handfast $GITHUB_REF_NAME" --generate-notes
            fi
          fi
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" -R "$GITHUB_REPOSITORY" --clobber
          done
